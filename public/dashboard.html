<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Djezzy | Tableau de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="shell">

  
  <aside class="sidebar">
    <div class="brand-mark">
      <div class="glyph"></div>
      <div>
        <span class="brand-name">djezzy</span>
        <span class="brand-tag">Espace Admin</span>
      </div>
    </div>

    <nav>
      <span class="nav-label">Général</span>
      <ul>
        <li class="active" data-view="dashboard"><i class="fa-solid fa-house"></i>Tableau de bord</li>
        <li id="campaignsLink">
    <i class="fa-solid fa-bullhorn"></i> Campagnes
</li>
        <li data-view="surveys"><i class="fa-solid fa-file-lines"></i>Sondages</li>
        <li data-view="recipients"><i class="fa-solid fa-users"></i>Destinataires</li>
      </ul>
      <span class="nav-label">Suivi</span>
      <ul>
        <li data-view="analytics"><i class="fa-solid fa-chart-column"></i>Analytique</li>
        <li data-view="password-requests"><i class="fa-solid fa-key"></i>Demandes de mot de passe</li>
        <li data-view="settings"><i class="fa-solid fa-gear"></i>Paramètres</li>
      </ul>
    </nav>

    <button class="logout-btn" id="logoutBtn">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
      Se déconnecter
    </button>
  </aside>

 
  <main>
    <header>
      <div>
        <h1 id="welcome">Bienvenue</h1>
        <p id="date"></p>
      </div>
      <div class="header-right">
        <button class="icon-btn" aria-label="Notifications">
          <i class="fa-solid fa-bell"></i>
          <span class="notification-count" id="notificationCount">0</span>
        </button>
        <div class="profile">
          <i class="fa-solid fa-circle-user"></i>
          <div>
            <span id="adminName">—</span>
            <span class="role-tag" id="adminRole">—</span>
          </div>
        </div>
      </div>
    </header>

    <section class="cards">
      <div class="card">
        <div class="card-top">
          <i class="fa-solid fa-bullhorn"></i>
          <div class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
        <h3>Campagnes actives</h3>
        <h2 id="campaignCount">—</h2>
      </div>

      <div class="card">
        <div class="card-top">
          <i class="fa-solid fa-users"></i>
          <div class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
        <h3>Destinataires</h3>
        <h2 id="recipientCount">—</h2>
      </div>

      <div class="card">
        <div class="card-top">
          <i class="fa-solid fa-file-lines"></i>
          <div class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
        <h3>Sondages</h3>
        <h2 id="surveyCount">—</h2>
      </div>

      <div class="card">
        <div class="card-top">
          <i class="fa-solid fa-chart-line"></i>
          <div class="signal" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        </div>
        <h3>Réponses</h3>
        <h2 id="responseCount">—</h2>
      </div>
    </section>

    <section class="panel" id="statusPanel">
      <div class="panel-head">
        <h3>État de la session</h3>
      </div>
      <p id="statusMessage" class="status-message">Connexion au serveur…</p>
    </section>
  </main>
</div>

<script src="js/dashboard.js"></script>
</body>
</html>
